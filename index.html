<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <script>
    // Apply the saved theme before the page paints (see js/theme.js).
    try {
      if (localStorage.getItem('vt.theme') === 'dark') {
        document.documentElement.dataset.theme = 'dark';
        document.querySelector('meta[name="theme-color"]').content = '#0c1616';
      }
    } catch (e) {}
  </script>
  <meta name="description" content="English ⇄ Vietnamese (Northern / Hanoi) vocabulary trainer">
  <title>Vietnamese Trainer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <span class="brand" aria-hidden="true">🇻🇳</span>
    <h1 class="topbar-title" id="page-title">Vietnamese</h1>
    <a class="topbar-action" href="#/settings" data-tab="settings" aria-label="Backup and settings" title="Backup and settings"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h10M18 18h2"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="18" r="2"/></svg></span></a>
  </header>

  <main id="app" tabindex="-1">
    <p class="muted center">Loading…</p>
  </main>

  <nav class="tabbar" aria-label="Main">
    <a href="#/" data-tab="home"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg></span><span>Home</span></a>
    <a href="#/words" data-tab="words"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14v15H5zM9 9h6M9 13h6"/></svg></span><span>Words</span></a>
    <a href="#/train" data-tab="train"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5l11 7-11 7z"/></svg></span><span>Train</span></a>
  </nav>

  <noscript><p class="center">This app needs JavaScript enabled.</p></noscript>
</body>
</html>
